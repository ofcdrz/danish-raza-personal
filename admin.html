<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISARA | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* ================= VARIABLES & RESET ================= */
:root {
  --ivory: #faf8f4; --sand: #eee7dc; --ink: #28231f; --muted: #786f66; --gold: #a77c55; --line: #e6ded3; --white: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--ivory); color: var(--ink); font-family: "DM Sans", sans-serif; line-height: 1.65; }
a { text-decoration: none; color: inherit; }

/* ================= HEADER ================= */
.admin-header { background: var(--ink); color: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
.admin-header h1 { font-family: 'Playfair Display', serif; font-size: 24px; letter-spacing: 2px; }
.admin-header a { color: var(--gold); font-size: 14px; border: 1px solid var(--gold); padding: 8px 15px; border-radius: 4px; transition: all 0.3s; }
.admin-header a:hover { background: var(--gold); color: var(--white); }

/* ================= LAYOUT ================= */
.admin-container { display: grid; grid-template-columns: 400px 1fr; gap: 30px; padding: 40px 5%; max-width: 1400px; margin: auto; }

/* ================= FORM ================= */
.form-section { background: var(--white); padding: 30px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.form-section h2 { font-family: 'Playfair Display', serif; font-weight: 500; margin-bottom: 20px; font-size: 24px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; color: var(--muted); }
.form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--line); background: var(--ivory); font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border 0.3s; }
.form-group input:focus, .form-group select:focus { border-color: var(--gold); }
.btn-submit { width: 100%; padding: 15px; background: var(--ink); color: var(--white); border: none; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
.btn-submit:hover { background: var(--gold); }
.btn-submit:disabled { background: var(--muted); cursor: not-allowed; }

/* ================= PRODUCT LIST ================= */
.list-section { background: var(--white); padding: 30px; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
.list-section h2 { font-family: 'Playfair Display', serif; font-weight: 500; margin-bottom: 20px; font-size: 24px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.product-table { width: 100%; border-collapse: collapse; }
.product-table th, .product-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--line); }
.product-table th { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: 1px; }
.product-table img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.delete-btn { background: #ff4d4d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.3s; }
.delete-btn:hover { background: #cc0000; }

/* Toast */
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: white; padding: 15px 25px; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 9999; }
#toast.show { opacity: 1; }

@media (max-width: 900px) {
  .admin-container { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="admin-header">
  <h1>ISARA Admin</h1>
  <a href="index.html" target="_blank">View Website →</a>
</header>

<div class="admin-container">
  <!-- ADD PRODUCT FORM -->
  <div class="form-section">
    <h2>Add New Product</h2>
    <form id="productForm">
      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="name" required placeholder="e.g. Elegant Ethnic Wear">
      </div>
      <div class="form-group">
        <label>Price</label>
        <input type="text" id="price" required placeholder="e.g. ₹1500 or On Enquiry">
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="category">
          <option value="Ethnic">Ethnic Wear</option>
          <option value="Party">Party Wear</option>
        </select>
      </div>
      <div class="form-group">
        <label>Product Image</label>
        <input type="file" id="image" accept="image/*" required>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn">Upload & Save Product</button>
    </form>
  </div>

  <!-- PRODUCT LIST -->
  <div class="list-section">
    <h2>Current Products</h2>
    <div style="overflow-x: auto;">
      <table class="product-table">
        <thead>
          <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="productList">
          <!-- Products will load here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast">Message</div>

<!-- Supabase Script -->
<script type="module">
  // 1. Supabase details
  const SUPABASE_URL = 'https://mnghsyllrmlzkkbpmsbx.supabase.co/rest/v1';
  const SUPABASE_KEY = 'sb_publishable_iNdQQLJ_ukM8Lb2CEZtoBQ_JA50m-w8';
  const BASE_URL = 'https://mnghsyllrmlzkkbpmsbx.supabase.co';

  const form = document.getElementById('productForm');
  const submitBtn = document.getElementById('submitBtn');
  const productList = document.getElementById('productList');

  async function apiRequest(endpoint, method = 'GET', body = null, isFormData = false) {
    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    };
    
    if (!isFormData && body) {
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=minimal';
    }

    const response = await fetch(endpoint, {
      method: method,
      headers: headers,
      body: body ? (isFormData ? body : JSON.stringify(body)) : null
    });

    if (!response.ok) throw new Error('API Error');
    
    // For DELETE and POST requests (when no data is expected to return)
    if (method === 'DELETE') return true;
    if (method === 'POST' && endpoint.includes('products')) return true;
    
    return await response.json();
  }

  async function loadProducts() {
    try {
      const data = await apiRequest(`${SUPABASE_URL}/products?select=*&order=created_at.desc`);
      productList.innerHTML = '';
      
      if (data.length === 0) {
        productList.innerHTML = '<tr><td colspan="5" style="text-align:center;">No products found.</td></tr>';
        return;
      }

      data.forEach(product => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><img src="${product.image_url}" alt="img"></td>
          <td style="font-weight:600;">${product.name}</td>
          <td>${product.category}</td>
          <td>${product.price}</td>
          <td><button class="delete-btn" onclick="deleteProduct(${product.id})">Delete</button></td>
        `;
        productList.appendChild(tr);
      });
    } catch (error) {
      showToast('Error loading products');
      console.error(error);
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const name = document.getElementById('name').value;
    const price = document.getElementById('price').value;
    const category = document.getElementById('category').value;
    const imageFile = document.getElementById('image').files[0];

    if (!imageFile) return showToast('Please select an image');

    submitBtn.disabled = true;
    submitBtn.innerText = 'Uploading Image...';

    try {
      const fileName = `product-${Date.now()}.jpg`;
      const uploadUrl = `${BASE_URL}/storage/v1/object/product-images/${fileName}`;
      
      await apiRequest(uploadUrl, 'POST', imageFile, true);

      const imageUrl = `${BASE_URL}/storage/v1/object/public/product-images/${fileName}`;

      submitBtn.innerText = 'Saving Product...';
      const dbUrl = `${SUPABASE_URL}/products`;
      
      await apiRequest(dbUrl, 'POST', {
        name: name,
        price: price,
        category: category,
        image_url: imageUrl
      });

      showToast('✅ Product Added Successfully!');
      form.reset();
      loadProducts(); 

    } catch (error) {
      showToast('❌ Error: Please check console');
      console.error(error);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Upload & Save Product';
    }
  });

  window.deleteProduct = async function(id) {
    if (!confirm('Are you sure you want to delete this product?')) return;
    
    try {
      await apiRequest(`${SUPABASE_URL}/products?id=eq.${id}`, 'DELETE');
      showToast('🗑️ Product Deleted');
      loadProducts();
    } catch (error) {
      showToast('Error deleting product');
    }
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.innerText = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  loadProducts();
</script>

</body>
</html>
