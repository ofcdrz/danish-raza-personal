<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISARA | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --ivory: #faf8f4; --sand: #eee7dc; --ink: #28231f; --muted: #786f66; --gold: #a77c55; --line: #e6ded3; --white: #ffffff; --danger: #e74c3c; --blue: #3498db; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--ivory); color: var(--ink); font-family: "DM Sans", sans-serif; line-height: 1.65; }

/* Login */
#login-screen { position: fixed; inset: 0; background: var(--ink); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-box { background: var(--ivory); padding: 40px; border-radius: 8px; text-align: center; width: 100%; max-width: 400px; }
.login-box h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 20px; }
.login-box input { width: 100%; padding: 15px; font-size: 18px; text-align: center; border: 1px solid var(--line); margin-bottom: 20px; background: var(--white); outline: none; border-radius: 4px; }
.login-box button { width: 100%; padding: 15px; background: var(--gold); color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: 600; }

/* Header & Grid */
#admin-app { display: none; } 
.admin-header { background: var(--ink); color: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
.admin-header h1 { font-family: 'Playfair Display', serif; font-size: 22px; }
.admin-header .btn-logout { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 15px; cursor: pointer; border-radius: 4px; }
.admin-container { display: grid; grid-template-columns: 460px 1fr; gap: 30px; padding: 40px 5%; max-width: 1400px; margin: auto; }
@media (max-width: 960px) { .admin-container { grid-template-columns: 1fr; padding: 20px; } }

.form-section, .list-section { background: var(--white); padding: 30px; border: 1px solid var(--line); border-radius: 8px; height: fit-content; }
.form-section h2, .list-section h2 { font-family: 'Playfair Display', serif; margin-bottom: 20px; font-size: 24px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; color: var(--muted); }
.form-group input[type="text"], .form-group input[type="number"], .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--line); background: var(--ivory); font-family: 'DM Sans', sans-serif; outline: none; border-radius: 4px; }
.form-group textarea { height: 80px; resize: vertical; }

/* Custom Multi-Photo Uploader */
.upload-box { border: 2px dashed var(--gold); background: var(--ivory); padding: 15px; text-align: center; border-radius: 6px; cursor: pointer; transition: 0.2s; }
.upload-box:hover { background: var(--sand); }
.upload-box span { font-size: 14px; font-weight: 600; color: var(--ink); display: block; }
.upload-box small { font-size: 11px; color: var(--muted); }

.preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.preview-item { position: relative; width: 72px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.preview-item img { width: 100%; height: 100%; object-fit: cover; }
.preview-item .remove-img-btn { position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; background: rgba(231, 76, 60, 0.95); color: white; border: none; border-radius: 50%; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
.preview-item .cover-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(40, 35, 31, 0.8); color: white; font-size: 9px; text-align: center; padding: 2px 0; text-transform: uppercase; }

/* Switch */
.switch-container { display: flex; align-items: center; gap: 10px; }
.switch { position: relative; display: inline-block; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--gold); }
input:checked + .slider:before { transform: translateX(24px); }

/* Buttons */
.btn-submit { width: 100%; padding: 15px; background: var(--ink); color: var(--white); border: none; cursor: pointer; margin-top:10px; font-weight:600; letter-spacing:1px; border-radius: 4px; }
.btn-submit:disabled { background: var(--muted); cursor: not-allowed; }
.btn-cancel { display:none; width:100%; padding:12px; background:#e0e0e0; color: var(--ink); margin-top:10px; cursor:pointer; border:none; border-radius: 4px; font-weight: 600; }

/* Table */
.list-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.list-header h2 { border: none; margin: 0; padding: 0; }
.tabs { display: flex; gap: 10px; }
.tab-btn { padding: 8px 20px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); border-radius: 4px; }
.tab-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
.product-table { width: 100%; border-collapse: collapse; }
.product-table th, .product-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
.img-badge-wrap { position: relative; display: inline-block; }
.product-table img { width: 55px; height: 55px; object-fit: cover; border-radius: 4px; display: block; }
.img-count-badge { position: absolute; bottom: -5px; right: -5px; background: var(--gold); color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: 600; }
.action-btn { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; color: white; margin-right: 5px; font-size: 12px; }
.btn-edit { background: var(--blue); }
.btn-delete { background: var(--danger); }

/* Toast */
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: white; padding: 15px 25px; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 10000; max-width: 350px; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>ISARA Admin</h1>
    <input type="password" id="admin-password" placeholder="Enter PIN" onkeypress="if(event.key==='Enter') checkPassword()">
    <button onclick="checkPassword()">Login</button>
  </div>
</div>

<div id="admin-app">
  <header class="admin-header">
    <h1>ISARA Dashboard</h1>
    <div>
      <a href="index.html" target="_blank" style="color:var(--gold); margin-right:15px; text-decoration:none; font-size:14px;">View Website →</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="admin-container">
    <!-- FORM -->
    <div class="form-section">
      <h2 id="formTitle">Add New Product</h2>
      <form id="productForm">
        <input type="hidden" id="productId" value="">
        
        <div class="form-group">
          <label>Product Name *</label>
          <input type="text" id="name" required placeholder="e.g. Royal Silk Lehenga">
        </div>
        
        <div class="form-group">
          <label>Description</label>
          <textarea id="description" placeholder="Product details..."></textarea>
        </div>
        
        <div class="form-group">
          <label>Price</label>
          <input type="text" id="price" placeholder="e.g. ₹14,500">
        </div>
        
        <div class="form-group">
          <label>Show Price?</label>
          <div class="switch-container">
            <label class="switch"><input type="checkbox" id="showPrice" checked><span class="slider"></span></label>
            <span id="priceStatusText" style="font-size:13px; color:var(--muted);">Yes, show price</span>
          </div>
        </div>
        
        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="Ethnic">Ethnic Wear</option>
            <option value="Party">Party Wear</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Main Photo Size (Height in px)</label>
          <input type="number" id="image_size" value="650">
        </div>
        
        <div class="form-group">
          <label>Product Photos (Multiple Allowed)</label>
          <!-- Hidden file input -->
          <input type="file" id="images" accept="image/*" multiple style="display:none;">
          
          <div class="upload-box" onclick="document.getElementById('images').click()">
            <span>+ Click to Add Photos</span>
            <small>Ek saath ya baar-baar click karke multiple photos jodein</small>
          </div>
          
          <!-- Preview Grid with Remove (×) button -->
          <div id="imagePreview" class="preview-grid"></div>
        </div>
        
        <button type="submit" class="btn-submit" id="submitBtn">Upload & Save</button>
        <button type="button" id="cancelEditBtn" class="btn-cancel">Cancel Edit</button>
      </form>
    </div>

    <!-- LIST -->
    <div class="list-section">
      <div class="list-header">
        <h2>Manage Products</h2>
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('Ethnic', this)">Ethnic Wear</button>
          <button class="tab-btn" onclick="switchTab('Party', this)">Party Wear</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table class="product-table">
          <thead>
            <tr>
              <th>Photos</th>
              <th>Name</th>
              <th>Size</th>
              <th>Price</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="productList"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="toast">Message</div>

<script>
  const CORRECT_PASSWORD = "isara123"; 
  if(sessionStorage.getItem('isara_admin_logged_in') === 'true') { showAdminApp(); }
  function checkPassword() {
    if(document.getElementById('admin-password').value === CORRECT_PASSWORD) { 
      sessionStorage.setItem('isara_admin_logged_in', 'true'); 
      showAdminApp(); 
    } else { alert("Galat PIN!"); }
  }
  function showAdminApp() { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-app').style.display = 'block'; }
  function logout() { sessionStorage.removeItem('isara_admin_logged_in'); window.location.reload(); }
</script>

<script type="module">
  const SUPABASE_URL = 'https://mnghsyllrmlzkkbpmsbx.supabase.co/rest/v1';
  const SUPABASE_KEY = 'sb_publishable_iNdQQLJ_ukM8Lb2CEZtoBQ_JA50m-w8';
  const BASE_URL = 'https://mnghsyllrmlzkkbpmsbx.supabase.co';

  const form = document.getElementById('productForm');
  const productList = document.getElementById('productList');
  const imageInput = document.getElementById('images');
  const imagePreview = document.getElementById('imagePreview');
  const showPriceCheckbox = document.getElementById('showPrice');

  let currentCategory = 'Ethnic'; 
  let isEditing = false;
  let loadedProductsMap = {};

  // Master array for photos: { type: 'url', value: '...' } OR { type: 'file', file: FileObject, preview: 'data:...' }
  let photoQueue = [];
  let removedUrlsOnEdit = []; // Edit ke dauran hatayi gayi purani photos

  showPriceCheckbox.addEventListener('change', () => {
    document.getElementById('priceStatusText').innerText = showPriceCheckbox.checked ? 'Yes, show price' : 'No, show "On Enquiry"';
  });

  // Nayi photos select karne par queue mein ADD karein (overwrite nahi karega)
  imageInput.addEventListener('change', () => {
    const files = Array.from(imageInput.files);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = (e) => {
        photoQueue.push({ type: 'file', file: file, preview: e.target.result });
        renderPhotoQueue();
      };
      reader.readAsDataURL(file);
    });
    imageInput.value = ''; // Reset input taaki same file dobara select ho sake
  });

  // Preview Grid Render karna
  function renderPhotoQueue() {
    imagePreview.innerHTML = '';
    photoQueue.forEach((item, index) => {
      const src = item.type === 'url' ? item.value : item.preview;
      const coverLabel = index === 0 ? `<span class="cover-tag">Main Cover</span>` : '';
      imagePreview.innerHTML += `
        <div class="preview-item">
          <img src="${src}" alt="photo">
          ${coverLabel}
          <button type="button" class="remove-img-btn" onclick="removePhotoFromQueue(${index})" title="Remove photo">×</button>
        </div>
      `;
    });
  }

  // Kisi bhi individual photo ko queue se hatana
  window.removePhotoFromQueue = function(index) {
    const removed = photoQueue.splice(index, 1)[0];
    if (removed && removed.type === 'url') {
      removedUrlsOnEdit.push(removed.value);
    }
    renderPhotoQueue();
  }

  window.switchTab = function(category, btn) {
    currentCategory = category;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetForm(); 
    loadProducts(category);
  }

  async function apiRequest(endpoint, method = 'GET', body = null, contentType = 'application/json') {
    const headers = { 
      'apikey': SUPABASE_KEY, 
      'Authorization': `Bearer ${SUPABASE_KEY}` 
    };

    if (body && contentType === 'application/json') {
      headers['Content-Type'] = 'application/json';
      headers['Prefer'] = 'return=representation'; // Confirm karta hai ki row actually update/delete hui ya nahi
    } else if (body && contentType) {
      headers['Content-Type'] = contentType;
    }

    const response = await fetch(endpoint, { 
      method, 
      headers, 
      body: body ? (contentType === 'application/json' ? JSON.stringify(body) : body) : null 
    });

    if (!response.ok) {
      const errText = await response.text();
      throw new Error(`${response.status}: ${errText}`);
    }

    const text = await response.text();
    return text ? JSON.parse(text) : true;
  }

  // Supabase Storage se multiple files delete karne ka sahi tarika
  async function deleteFilesFromStorage(urlsArray) {
    const fileNames = urlsArray
      .map(url => url.trim().split('/').pop())
      .filter(name => name && name.length > 0);
    
    if (fileNames.length === 0) return;

    try {
      await apiRequest(
        `${BASE_URL}/storage/v1/object/product-images`, 
        'DELETE', 
        { prefixes: fileNames }, 
        'application/json'
      );
    } catch (err) {
      console.warn("Storage delete warning:", err.message);
    }
  }

  async function loadProducts(category) {
    productList.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Loading...</td></tr>';
    try {
      const data = await apiRequest(`${SUPABASE_URL}/products?category=eq.${category}&select=*&order=created_at.desc`);
      productList.innerHTML = '';
      loadedProductsMap = {};

      if (!data || data.length === 0) {
        productList.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px; color:var(--muted);">No products found.</td></tr>';
        return;
      }

      data.forEach(product => {
        loadedProductsMap[product.id] = product;
        const priceDisplay = product.show_price ? product.price : 'On Enquiry';
        const urls = product.image_url ? product.image_url.split(',').map(u => u.trim()).filter(Boolean) : [];
        const mainImage = urls[0] || 'assets/assets/Ethnic%20Wear.jpg';
        const badge = urls.length > 1 ? `<span class="img-count-badge">${urls.length} Photos</span>` : '';
        
        productList.innerHTML += `
          <tr>
            <td>
              <div class="img-badge-wrap">
                <img src="${mainImage}" alt="img">
                ${badge}
              </div>
            </td>
            <td><strong>${product.name}</strong></td>
            <td>${product.image_size || 650}px</td>
            <td>${priceDisplay}</td>
            <td>
              <button class="action-btn btn-edit" onclick="editProduct(${product.id})">Edit</button>
              <button class="action-btn btn-delete" onclick="deleteProduct(${product.id})">Delete</button>
            </td>
          </tr>
        `;
      });
    } catch (error) { 
      console.error(error);
      productList.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Error: ${error.message}</td></tr>`;
    }
  }

  window.editProduct = function(id) {
    const product = loadedProductsMap[id];
    if (!product) return;

    isEditing = true;
    removedUrlsOnEdit = [];
    
    document.getElementById('formTitle').innerText = "Edit Product";
    document.getElementById('productId').value = product.id;
    document.getElementById('name').value = product.name;
    document.getElementById('description').value = product.description || '';
    document.getElementById('price').value = product.price === 'On Enquiry' ? '' : product.price;
    document.getElementById('category').value = product.category;
    document.getElementById('image_size').value = product.image_size || 650;
    showPriceCheckbox.checked = product.show_price;
    document.getElementById('priceStatusText').innerText = product.show_price ? 'Yes, show price' : 'No, show "On Enquiry"';
    
    // Existing URLs ko photoQueue mein load karein taaki user unhe dekh, hata, ya naye jod sake
    const existingUrls = product.image_url ? product.image_url.split(',').map(u => u.trim()).filter(Boolean) : [];
    photoQueue = existingUrls.map(url => ({ type: 'url', value: url }));
    renderPhotoQueue();

    document.getElementById('submitBtn').innerText = 'Update Product';
    document.getElementById('cancelEditBtn').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    isEditing = false;
    photoQueue = [];
    removedUrlsOnEdit = [];
    document.getElementById('formTitle').innerText = "Add New Product";
    form.reset();
    document.getElementById('productId').value = '';
    document.getElementById('image_size').value = 650;
    renderPhotoQueue();
    document.getElementById('priceStatusText').innerText = 'Yes, show price';
    document.getElementById('submitBtn').innerText = 'Upload & Save';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }
  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    if (photoQueue.length === 0) {
      showToast('⚠️ Kam se kam 1 photo zaroor add karein!');
      return;
    }

    const id = document.getElementById('productId').value;
    const name = document.getElementById('name').value.trim();
    const description = document.getElementById('description').value.trim();
    const price = document.getElementById('price').value.trim() || "On Enquiry";
    const showPrice = showPriceCheckbox.checked;
    const category = document.getElementById('category').value;
    const imageSize = parseInt(document.getElementById('image_size').value) || 650;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    
    try {
      submitBtn.innerText = 'Processing Photos...';
      
      // Queue mein maujood purani URLs aur nayi Files dono ko order mein process karein
      const finalUrls = await Promise.all(photoQueue.map(async (item, index) => {
        if (item.type === 'url') {
          return item.value;
        } else {
          const ext = item.file.name.split('.').pop() || 'jpg';
          const fileName = `product-${Date.now()}-${index}-${Math.floor(Math.random()*1000)}.${ext}`;
          await apiRequest(
            `${BASE_URL}/storage/v1/object/product-images/${fileName}`, 
            'POST', 
            item.file, 
            item.file.type || 'image/jpeg'
          );
          return `${BASE_URL}/storage/v1/object/public/product-images/${fileName}`;
        }
      }));

      const finalImageUrl = finalUrls.join(',');

      if (isEditing) {
        submitBtn.innerText = 'Updating...';
        const res = await apiRequest(`${SUPABASE_URL}/products?id=eq.${id}`, 'PATCH', {
          name, description, price, show_price: showPrice, category, image_size: imageSize, image_url: finalImageUrl
        });
        
        if (Array.isArray(res) && res.length === 0) {
          throw new Error("Supabase RLS Policy ne Update block kiya hai!");
        }

        // Jo purani photos edit ke waqt × dabakar hatayi gayin, unhe storage se delete karein
        if (removedUrlsOnEdit.length > 0) {
          await deleteFilesFromStorage(removedUrlsOnEdit);
        }
        showToast('✅ Product Updated!');
      } else {
        submitBtn.innerText = 'Saving...';
        await apiRequest(`${SUPABASE_URL}/products`, 'POST', {
          name, description, price, show_price: showPrice, category, image_url: finalImageUrl, image_size: imageSize
        });
        showToast('✅ Product Added!');
      }

      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(category));
      });

      resetForm();
      loadProducts(category); 
    } catch (error) { 
      showToast('❌ ' + error.message); 
      console.error(error); 
    } finally { 
      submitBtn.disabled = false; 
      submitBtn.innerText = isEditing ? 'Update Product' : 'Upload & Save';
    }
  });

  window.deleteProduct = async function(id) {
    const product = loadedProductsMap[id];
    if (!product || !confirm(`Kya aap "${product.name}" ko delete karna chahte hain?`)) return;
    
    try {
      const res = await apiRequest(`${SUPABASE_URL}/products?id=eq.${id}`, 'DELETE');
      
      if (Array.isArray(res) && res.length === 0) {
        throw new Error("Delete failed! Supabase mein DELETE policy enable nahi hai.");
      }

      if (product.image_url) {
        await deleteFilesFromStorage(product.image_url.split(','));
      }
      
      showToast('🗑️ Product Deleted Successfully!');
      loadProducts(currentCategory); 
    } catch (error) { 
      showToast('❌ ' + error.message); 
      console.error(error);
    }
  }

  function showToast(msg) { 
    const toast = document.getElementById('toast'); 
    toast.innerText = msg; 
    toast.classList.add('show'); 
    setTimeout(() => toast.classList.remove('show'), 4500); 
  }

  if(sessionStorage.getItem('isara_admin_logged_in') === 'true') { 
    loadProducts('Ethnic'); 
  }
</script>
</body>
</html>
