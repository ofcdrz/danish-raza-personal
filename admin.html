<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISARA | Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ... (Aapka purana CSS waisa hi rahega, maine ise short kar diya hai space ke liye, aap ise replace kar dein) ... */
:root { --ivory: #faf8f4; --sand: #eee7dc; --ink: #28231f; --muted: #786f66; --gold: #a77c55; --line: #e6ded3; --white: #ffffff; --danger: #e74c3c; --blue: #3498db; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--ivory); color: var(--ink); font-family: "DM Sans", sans-serif; line-height: 1.65; }
#login-screen { position: fixed; inset: 0; background: var(--ink); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.login-box { background: var(--ivory); padding: 40px; border-radius: 8px; text-align: center; width: 100%; max-width: 400px; }
.login-box h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 20px; }
.login-box input { width: 100%; padding: 15px; font-size: 20px; text-align: center; letter-spacing: 5px; border: 1px solid var(--line); margin-bottom: 20px; background: var(--white); }
.login-box button { width: 100%; padding: 15px; background: var(--gold); color: white; border: none; font-size: 16px; cursor: pointer; }
.error-msg { color: var(--danger); margin-bottom: 15px; display: none; }
#admin-app { display: none; } 
.admin-header { background: var(--ink); color: var(--white); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; }
.admin-header h1 { font-family: 'Playfair Display', serif; font-size: 24px; }
.admin-header .btn-logout { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 8px 15px; cursor: pointer; }
.admin-container { display: grid; grid-template-columns: 400px 1fr; gap: 30px; padding: 40px 5%; max-width: 1400px; margin: auto; }
.form-section, .list-section { background: var(--white); padding: 30px; border: 1px solid var(--line); border-radius: 8px; height: fit-content; }
.form-section h2, .list-section h2 { font-family: 'Playfair Display', serif; font-weight: 500; margin-bottom: 20px; font-size: 24px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; color: var(--muted); }
.form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--line); background: var(--ivory); font-family: 'DM Sans', sans-serif; }
.switch-container { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
.switch { position: relative; display: inline-block; width: 50px; height: 26px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 26px; }
.slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: var(--gold); }
input:checked + .slider:before { transform: translateX(24px); }
.switch-label { font-size: 14px; font-weight: 600; color: var(--ink); }
.btn-submit { width: 100%; padding: 15px; background: var(--ink); color: var(--white); border: none; cursor: pointer; }
.btn-submit:hover { background: var(--gold); }
.list-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; }
.tabs { display: flex; gap: 10px; }
.tab-btn { padding: 8px 20px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
.product-table { width: 100%; border-collapse: collapse; }
.product-table th, .product-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--line); }
.product-table img { width: 60px; height: 60px; object-fit: cover; }
.action-btn { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: none; color: white; margin-right: 5px; }
.btn-edit { background: var(--blue); }
.btn-delete { background: var(--danger); }
#toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: white; padding: 15px 25px; border-radius: 4px; opacity: 0; transition: opacity 0.3s; z-index: 10000; }
#toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>ISARA Admin</h1>
    <div class="error-msg" id="login-error">Galat Password!</div>
    <input type="password" id="admin-password" placeholder="Enter PIN">
    <button onclick="checkPassword()">Login</button>
  </div>
</div>

<div id="admin-app">
  <header class="admin-header">
    <h1>Admin Dashboard</h1>
    <div>
      <a href="index.html" target="_blank" style="color:var(--gold); margin-right:15px; font-size:14px;">View Website →</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="admin-container">
    <div class="form-section">
      <h2 id="formTitle">Add New Product</h2>
      <form id="productForm">
        <input type="hidden" id="productId" value="">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-group">
          <label>Price</label>
          <input type="text" id="price">
        </div>
        <div class="form-group">
          <label>Show Price on Website?</label>
          <div class="switch-container">
            <label class="switch"><input type="checkbox" id="showPrice" checked><span class="slider"></span></label>
            <span class="switch-label" id="showPriceText">Yes</span>
          </div>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="category">
            <option value="Ethnic">Ethnic Wear</option>
            <option value="Party">Party Wear</option>
          </select>
        </div>
        <div class="form-group">
          <label>Photo Height (px)</label>
          <input type="text" id="image_size" value="350">
        </div>
        <div class="form-group" id="imageInputGroup">
          <label>Product Image</label>
          <input type="file" id="image" accept="image/*">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Upload & Save</button>
        <button type="button" id="cancelEditBtn" style="display:none; width:100%; padding:10px; background:#ccc; margin-top:10px; cursor:pointer;">Cancel Edit</button>
      </form>
    </div>

    <div class="list-section">
      <div class="list-header">
        <h2>Manage Products</h2>
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('Ethnic', this)">Ethnic Wear</button>
          <button class="tab-btn" onclick="switchTab('Party', this)">Party Wear</button>
        </div>
      </div>
      <table class="product-table">
        <thead><tr><th>Image</th><th>Name</th><th>Size</th><th>Price</th><th>Action</th></tr></thead>
        <tbody id="productList"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="toast">Message</div>

<script>
  const CORRECT_PASSWORD = "isara123"; 
  if(sessionStorage.getItem('isara_admin_logged_in') === 'true') { showAdminApp(); }
  function checkPassword() {
    if(document.getElementById('admin-password').value === CORRECT_PASSWORD) { sessionStorage.setItem('isara_admin_logged_in', 'true'); showAdminApp(); } 
    else { document.getElementById('login-error').style.display = 'block'; }
  }
  function showAdminApp() { document.getElementById('login-screen').style.display = 'none'; document.getElementById('admin-app').style.display = 'block'; }
  function logout() { sessionStorage.removeItem('isara_admin_logged_in'); window.location.reload(); }
  
  const showPriceCheckbox = document.getElementById('showPrice');
  const showPriceText = document.getElementById('showPriceText');
  showPriceCheckbox.addEventListener('change', function() {
    showPriceText.innerText = this.checked ? "Yes" : "No";
  });
</script>

<script type="module">
  const SUPABASE_URL = 'https://mnghsyllrmlzkkbpmsbx.supabase.co/rest/v1';
  const SUPABASE_KEY = 'sb_publishable_iNdQQLJ_ukM8Lb2CEZtoBQ_JA50m-w8';
  const BASE_URL = 'https://mnghsyllrmlzkkbpmsbx.supabase.co';

  const form = document.getElementById('productForm');
  const submitBtn = document.getElementById('submitBtn');
  const productList = document.getElementById('productList');
  let currentCategory = 'Ethnic'; 
  let isEditing = false;

  window.switchTab = function(category, btn) {
    currentCategory = category;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    resetForm(); 
    loadProducts(category);
  }

  async function apiRequest(endpoint, method = 'GET', body = null, isFormData = false) {
    const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` };
    if (!isFormData && body) { headers['Content-Type'] = 'application/json'; headers['Prefer'] = 'return=minimal'; }
    const response = await fetch(endpoint, { method, headers, body: body ? (isFormData ? body : JSON.stringify(body)) : null });
    if (!response.ok) throw new Error('API Error');
    if (method === 'DELETE' || method === 'POST' || method === 'PATCH') return true;
    return await response.json();
  }

  async function loadProducts(category) {
    productList.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading...</td></tr>';
    try {
      const data = await apiRequest(`${SUPABASE_URL}/products?category=eq.${category}&select=*&order=created_at.desc`);
      productList.innerHTML = '';
      if (data.length === 0) { productList.innerHTML = `<tr><td colspan="5" style="text-align:center;">No products found.</td></tr>`; return; }

      data.forEach(product => {
        const tr = document.createElement('tr');
        let priceDisplay = product.show_price ? product.price : 'On Enquiry';
        tr.innerHTML = `
          <td><img src="${product.image_url}" alt="img"></td>
          <td>${product.name}</td>
          <td>${product.image_size || 350}px</td>
          <td>${priceDisplay}</td>
          <td>
            <button class="action-btn btn-edit" onclick='editProduct(${JSON.stringify(product)})'>Edit</button>
            <button class="action-btn btn-delete" onclick="deleteProduct(${product.id}, '${product.image_url}')">Delete</button>
          </td>
        `;
        productList.appendChild(tr);
      });
    } catch (error) { showToast('Error loading products'); }
  }

  window.editProduct = function(product) {
    isEditing = true;
    document.getElementById('formTitle').innerText = "Edit Product";
    document.getElementById('productId').value = product.id;
    document.getElementById('name').value = product.name;
    document.getElementById('price').value = product.price;
    document.getElementById('category').value = product.category;
    document.getElementById('image_size').value = product.image_size || 350;
    document.getElementById('showPrice').checked = product.show_price;
    document.getElementById('showPriceText').innerText = product.show_price ? "Yes" : "No";
    document.getElementById('image').required = false;
    document.getElementById('imageInputGroup').style.display = 'none'; 
    submitBtn.innerText = 'Update Product';
    document.getElementById('cancelEditBtn').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function resetForm() {
    isEditing = false;
    document.getElementById('formTitle').innerText = "Add New Product";
    form.reset();
    document.getElementById('productId').value = '';
    document.getElementById('image_size').value = 350;
    document.getElementById('image').required = true;
    document.getElementById('imageInputGroup').style.display = 'block';
    submitBtn.innerText = 'Upload & Save';
    document.getElementById('cancelEditBtn').style.display = 'none';
    document.getElementById('showPriceText').innerText = "Yes";
  }

  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const name = document.getElementById('name').value;
    const price = document.getElementById('price').value || "On Enquiry";
    const showPrice = document.getElementById('showPrice').checked;
    const category = document.getElementById('category').value;
    const imageSize = document.getElementById('image_size').value || "350";
    const imageFile = document.getElementById('image').files[0];

    submitBtn.disabled = true;
    
    try {
      if (isEditing) {
        submitBtn.innerText = 'Updating...';
        await apiRequest(`${SUPABASE_URL}/products?id=eq.${id}`, 'PATCH', {
          name: name, price: price, show_price: showPrice, category: category, image_size: imageSize
        });
        showToast('✅ Product Updated!');
      } else {
        if (!imageFile) { showToast('Please select an image'); submitBtn.disabled = false; return; }
        submitBtn.innerText = 'Uploading...';
        
        const fileName = `product-${Date.now()}.jpg`;
        await apiRequest(`${BASE_URL}/storage/v1/object/product-images/${fileName}`, 'POST', imageFile, true);
        const imageUrl = `${BASE_URL}/storage/v1/object/public/product-images/${fileName}`;

        submitBtn.innerText = 'Saving Data...';
        await apiRequest(`${SUPABASE_URL}/products`, 'POST', {
          name: name, price: price, show_price: showPrice, category: category, image_url: imageUrl, image_size: imageSize
        });
        showToast('✅ Product Added!');
      }

      resetForm();
      loadProducts(category === currentCategory ? currentCategory : category); 

    } catch (error) { showToast('❌ Error occurred'); console.error(error); } 
    finally { submitBtn.disabled = false; }
  });

  window.deleteProduct = async function(id, imageUrl) {
    if (!confirm('Are you sure you want to delete this product?')) return;
    try {
      await apiRequest(`${SUPABASE_URL}/products?id=eq.${id}`, 'DELETE');
      if (imageUrl) {
        const fileName = imageUrl.split('/').pop();
        try { await apiRequest(`${BASE_URL}/storage/v1/object/product-images/${fileName}`, 'DELETE'); } catch(err) {}
      }
      showToast('🗑️ Product Deleted');
      loadProducts(currentCategory); 
    } catch (error) { showToast('Error deleting product'); }
  }

  function showToast(message) { const toast = document.getElementById('toast'); toast.innerText = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 3000); }

  if(sessionStorage.getItem('isara_admin_logged_in') === 'true') { loadProducts('Ethnic'); }
</script>
</body>
</html>
